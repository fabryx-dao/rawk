version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rawk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rawk_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rawk_console
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - rawk_internal
    # Security: No exposed ports - internal only

  redis:
    image: redis:7-alpine
    container_name: rawk_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - rawk_internal
    # Security: No exposed ports - internal only

  api:
    build: ./api
    container_name: rawk_api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"  # Only bind to localhost
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://rawk_admin:${POSTGRES_PASSWORD}@postgres:5432/rawk_console
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FRONTEND_URL: https://console.rawk.sh
      LINODE_DNS_TOKEN: ${LINODE_DNS_TOKEN}
      LINODE_DOMAIN_ID: ${LINODE_DOMAIN_ID}
      MAILCOW_API_KEY: ${MAILCOW_API_KEY}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN}
    depends_on:
      - postgres
      - redis
    networks:
      - rawk_internal

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  rawk_internal:
    driver: bridge
